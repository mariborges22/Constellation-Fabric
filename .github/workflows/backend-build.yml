name: Backend Build & Push

on:
  push:
    branches: [staging, main]
    paths:
      - 'backend/**'
  workflow_dispatch:

# Prevent parallel runs on the same environment
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Push (${{ github.ref_name }})
    runs-on: ubuntu-latest
    # Map branch to GitHub Environment
    environment: ${{ (github.ref_name == 'main' && 'production') || 'staging' }}
    
    permissions:
      id-token: write # Required for OIDC
      contents: read  # Required for checkout

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "backend"

      - name: Validation - Cargo Check
        run: cargo check --manifest-path backend/Cargo.toml

      - name: Validation - Unit Tests
        run: cargo test --manifest-path backend/Cargo.toml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Image for Smoke Test
        run: |
          docker build -t smoke-test ./backend
          
      - name: Validation - Container Smoke Test
        run: |
          docker run -d --name smoke-test-run -p 8080:8080 smoke-test
          sleep 5
          # Simple check to see if the process is still running and answering (even if 4xx/5xx)
          curl -f http://localhost:8080/health || (docker logs smoke-test-run && exit 1)
          docker rm -f smoke-test-run

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::629614691528:role/constellation-fabric-github-actions-role
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          # Tags specific to environment and commit
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/constellation-auth:${{ github.ref_name }}
            ${{ steps.login-ecr.outputs.registry }}/constellation-auth:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
