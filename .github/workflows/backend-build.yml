name: Backend Build & Push

on:
  push:
    branches: [staging, main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-build.yml'
  workflow_dispatch:

# Prevent parallel runs on the same environment
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Push (${{ github.ref_name }})
    runs-on: ubuntu-latest
    # Map branch to GitHub Environment
    environment: ${{ (github.ref_name == 'main' && 'production') || 'staging' }}
    
    permissions:
      id-token: write # Required for OIDC
      contents: read  # Required for checkout

    steps:
      - name: Free Disk Space (Optimized)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false # Desativado para ganhar velocidade
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false # Não queremos limpar as imagens base do Docker se usarmos cache local
          swap-storage: false

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "backend"

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::721529235452:role/constellation-fabric-github-actions-role
          aws-region: us-east-1

      - name: Login to Amazon ECR (US)
        id: login-ecr-us
        uses: aws-actions/amazon-ecr-login@v2
        with:
          region: us-east-1

      - name: Login to Amazon ECR (EU - Direct CLI)
        run: |
          aws ecr get-login-password --region eu-west-1 | docker login --username AWS --password-stdin 721529235452.dkr.ecr.eu-west-1.amazonaws.com

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Load (for Scanning & Testing)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: constellation-local:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'constellation-local:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Validation - Container Smoke Test
        run: |
          docker run -d --name smoke-test-run -p 8080:8080 constellation-local:latest
          sleep 5
          curl -f http://localhost:8080/health || (docker logs smoke-test-run && exit 1)
          docker rm -f smoke-test-run

      - name: Tag & Push to ECR (US)
        run: |
          # Nomes baseados na convenção do Terraform: constellation-fabric-[env]-[crate]
          REPO_PREFIX="721529235452.dkr.ecr.us-east-1.amazonaws.com/constellation-fabric-${{ (github.ref_name == 'main' && 'production') || 'staging' }}"
          
          docker tag constellation-local:latest ${REPO_PREFIX}-auth:${{ (github.ref_name == 'main' && 'latest') || github.ref_name }}
          docker tag constellation-local:latest ${REPO_PREFIX}-player_state:${{ (github.ref_name == 'main' && 'latest') || github.ref_name }}
          docker tag constellation-local:latest ${REPO_PREFIX}-combat:${{ (github.ref_name == 'main' && 'latest') || github.ref_name }}
          
          docker push ${REPO_PREFIX}-auth:${{ (github.ref_name == 'main' && 'latest') || github.ref_name }}
          docker push ${REPO_PREFIX}-player_state:${{ (github.ref_name == 'main' && 'latest') || github.ref_name }}
          docker push ${REPO_PREFIX}-combat:${{ (github.ref_name == 'main' && 'latest') || github.ref_name }}

      - name: Tag & Push to ECR (EU)
        run: |
          REPO_PREFIX="721529235452.dkr.ecr.eu-west-1.amazonaws.com/constellation-fabric-${{ (github.ref_name == 'main' && 'production') || 'staging' }}"
          TAG_NAME="${{ (github.ref_name == 'main' && 'latest') || github.ref_name }}"
          
          docker tag constellation-local:latest ${REPO_PREFIX}-auth-eu-west-1:${TAG_NAME}
          docker tag constellation-local:latest ${REPO_PREFIX}-player_state-eu-west-1:${TAG_NAME}
          docker tag constellation-local:latest ${REPO_PREFIX}-combat-eu-west-1:${TAG_NAME}
          
          docker push ${REPO_PREFIX}-auth-eu-west-1:${TAG_NAME}
          docker push ${REPO_PREFIX}-player_state-eu-west-1:${TAG_NAME}
          docker push ${REPO_PREFIX}-combat-eu-west-1:${TAG_NAME}
