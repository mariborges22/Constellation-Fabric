name: Backend Build & Push

on:
  push:
    branches: [staging, main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-build.yml'
  workflow_dispatch:

# Prevent parallel runs on the same environment
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Push (${{ github.ref_name }})
    runs-on: ubuntu-latest
    # Map branch to GitHub Environment
    environment: ${{ (github.ref_name == 'main' && 'production') || 'staging' }}
    
    permissions:
      id-token: write # Required for OIDC
      contents: read  # Required for checkout

    steps:
      - name: Free Disk Space (Optimized)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false # Desativado para ganhar velocidade
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false # Não queremos limpar as imagens base do Docker se usarmos cache local
          swap-storage: false

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "backend"

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::721529235452:role/constellation-fabric-github-actions-role
          aws-region: us-east-1

      - name: Login to Amazon ECR (US)
        id: login-ecr-us
        uses: aws-actions/amazon-ecr-login@v2
        with:
          region: us-east-1

      - name: Login to Amazon ECR (EU - Direct CLI)
        run: |
          aws ecr get-login-password --region eu-west-1 | docker login --username AWS --password-stdin 721529235452.dkr.ecr.eu-west-1.amazonaws.com

# QEMU removido - Agora usamos Cross-Compilation nativa para velocidade máxima

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push (Stable & Cached)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            721529235452.dkr.ecr.us-east-1.amazonaws.com/constellation-fabric-${{ (github.ref_name == 'main' && 'production') || 'staging' }}-auth:${{ github.sha }}
            721529235452.dkr.ecr.us-east-1.amazonaws.com/constellation-fabric-${{ (github.ref_name == 'main' && 'production') || 'staging' }}-combat:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Deployment Stage ---
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name constellation-fabric-eks --region us-east-1

      - name: Deploy to EKS
        run: |
          kubectl apply -f k8s/namespaces.yaml
          kubectl apply -f k8s/auth-service.yaml
          kubectl apply -f k8s/combat-service.yaml
          
          # Forçar reinício para garantir a nova imagem
          kubectl rollout restart deployment/auth-service -n constellation
          kubectl rollout restart deployment/combat-service -n constellation
