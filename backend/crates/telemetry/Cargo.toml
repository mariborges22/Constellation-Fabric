[package]
name = "telemetry"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
opentelemetry = "0.21"
opentelemetry-otlp = { version = "0.14", features = ["logs", "metrics", "trace"] }
opentelemetry-aws = "0.10"
tracing = "0.1"
tracing-opentelemetry = "0.22"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.7"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = "0.4"
thiserror = "1.0"

[lib]
name = "telemetry"
path = "src/lib.rs"

