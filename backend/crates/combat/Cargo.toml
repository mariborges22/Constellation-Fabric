[package]
name = "combat"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
player-state = { path = "../player-state" }
event-publisher = { path = "../event-publisher" }
shared = { path = "../../shared" }
rand = "0.8"
telemetry = { path = "../telemetry" }
tracing = "0.1"
thiserror = "1.0"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"
aws-config = "1.1"
aws-sdk-dynamodb = "1.1"
serde_dynamo = { version = "4.2", features = ["aws-sdk-dynamodb+1"] }

[lib]
name = "combat"
path = "src/lib.rs"

[[bin]]
name = "combat"
path = "src/main.rs"

